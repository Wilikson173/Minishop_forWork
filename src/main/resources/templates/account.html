<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/products/all">MiniStore <--это мейн</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text text-white me-3">
                    Привет, <b th:text="${user.name}">Имя</b>! 
                    Баланс: <span class="badge bg-success" th:text="${user.balance} + ' ₽'">0</span>
                </span>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h3 class="mb-3">Моя корзина</h3>
                <div th:if="${cart.isEmpty()}" class="alert alert-secondary">Корзина пуста</div>
                
                <div class="card mb-2 shadow-sm" th:each="order : ${cart}">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="card-title mb-0" th:text="${order.product.name}">Товар</h5>
                            <small class="text-muted" th:text="${order.product.price} + ' ₽'">Цена</small>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-success" th:onclick="'payOrder(' + ${order.oid} + ')'">Оплатить</button>
                            <button class="btn btn-sm btn-danger" th:onclick="'removeOrder(' + ${order.oid} + ')'">Удалить</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <h3 class="mb-3">Купленные товары</h3>
                <div th:if="${purchases.isEmpty()}" class="alert alert-secondary">Вы еще ничего не купили</div>
                
                <ul class="list-group shadow-sm">
                    <li class="list-group-item d-flex justify-content-between align-items-center" th:each="order : ${purchases}">
                        <span th:text="${order.product.name}">Товар</span>
                        <span class="badge bg-primary rounded-pill" th:text="${order.product.price} + ' ₽'">Цена</span>
                    </li>
                </ul>
            </div>
        </div>
        <div class="row mt-5" th:if="${user.admin}">
            <div class="col-12">
                <div class="card border-danger shadow-sm">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0">Управление пользователями (Админ)</h4>
                    </div>
                    <div class="card-body">
                        <ul class="list-group">
                            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="target : ${allUsers}">
                                <div>
                                    <strong th:text="${target.name}">Имя</strong> 
                                    (<span th:text="${target.login}">Логин</span>)
                                    <span class="badge bg-secondary ms-2" th:text="'Баланс: ' + ${target.balance} + ' ₽'">Баланс</span>
                                </div>
                                <div class="d-flex align-items-center">
                                    <input type="number" class="form-control form-control-sm me-2" th:id="'amount-' + ${target.uid}" placeholder="Сумма" style="width: 100px;">
                                    <button class="btn btn-sm btn-outline-danger" th:onclick="'addBalance(' + ${target.uid} + ')'">Перечислить</button>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        async function payOrder(orderId) {
            const response = await fetch(`/orders/pay?orderId=${orderId}`, {
                method: 'POST'
            });
            const text = await response.text();
            alert(text);
            
            location.reload(); 
        }

        async function removeOrder(orderId) {
            const response = await fetch(`/orders/remove?orderId=${orderId}`, {
                method: 'DELETE'
            });
            const text = await response.text();
            alert(text);
            
            location.reload();
        }
        async function addBalance(targetUserId) {
            const amountInput = document.getElementById('amount-' + targetUserId);
            const amount = amountInput.value;
            
            if (!amount || amount <= 0) {
                alert("Введите корректную сумму!");
                return;
            }
            
            const response = await fetch(`/users/add-balance?targetUserId=${targetUserId}&amount=${amount}`, {
                method: 'POST'
            });
            
            const text = await response.text();
            alert(text);
            
            location.reload();
        }
    </script>
</body>
</html>
