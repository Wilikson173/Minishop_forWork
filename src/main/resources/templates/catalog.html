<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Каталог товаров</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">MiniStore  <--это меин</a>
            <a class="btn btn-outline-light" href="/my-account">Моя корзина</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Наши товары</h2>
        
        <div class="row">
            <div class="col-md-4 mb-4" th:each="product : ${products}">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${product.name}">Название товара</h5>
                        <p class="card-text text-muted" th:text="${product.about}">Описание</p>
                        <h4 class="text-success" th:text="${product.price} + ' ₽'">0.0 ₽</h4>
           
                        <button type="button" class="btn btn-primary w-100 mt-3" th:onclick="|addToCart(${product.id})|">Добавить в корзину</button>
                        <button th:if="${user != null and user.admin}" class="btn btn-sm btn-outline-danger w-100 mt-2" th:onclick="'deleteProduct(' + ${product.id} + ')'">Удалить товар (for root)</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-5 mb-5" th:if="${user != null and user.admin}">
            <div class="col-12">
                <a href="/create-product" class="btn btn-success w-100 py-3 text-uppercase fw-bold shadow">
                    + Создать новый товар
                </a>
            </div>
        </div>
    </div>
    <script>
        async function addToCart(productId) {
            try {
                const response = await fetch(`/orders/add-to-cart?productId=${productId}`, {
                    method: 'POST'
                });
                
                if (response.redirected && response.url.includes('/login')) {
                    window.location.href = '/my-account';
                    return;
                }
                
                const text = await response.text();
                
                if (text.trim().startsWith('<!DOCTYPE html>')) {
                    window.location.href = '/my-account';
                    return;
                }

                alert(text); 
            } catch (error) {
                console.error("Ошибка при отправке запроса:", error);
                alert("Не удалось связаться с сервером.");
            }
        }
        
        async function deleteProduct(productId) {
            if (!confirm("Вы уверены, что хотите удалить этот товар?")) return;
            const response = await fetch(`/products/delete?productId=${productId}`, { method: 'DELETE' });
            alert(await response.text());
            location.reload();
        }
    </script>
</body>
</html>
