<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание товара</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 500px;">
        <h3 class="text-center mb-4">Новый товар</h3>
        
        <form id="productForm">
            <div class="mb-3">
                <label class="form-label">Название</label>
                <input type="text" id="prod-name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Описание</label>
                <textarea id="prod-about" class="form-control" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Цена (₽)</label>
                <input type="number" step="0.01" id="prod-price" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Количество на складе</label>
                <input type="number" id="prod-stock" class="form-control" required>
            </div>
            
            <button type="button" class="btn btn-success w-100" onclick="submitProduct()">Создать товар</button>
            <a href="/products/all" class="btn btn-outline-secondary w-100 mt-2">Отмена</a>
        </form>
    </div>

    <script>
        async function submitProduct() {
            const product = {
                name: document.getElementById('prod-name').value,
                about: document.getElementById('prod-about').value,
                price: parseFloat(document.getElementById('prod-price').value),
                stockcnt: parseInt(document.getElementById('prod-stock').value)
            };

            const response = await fetch('/products/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(product)
            });

            alert(await response.text());
            if (response.ok) window.location.href = '/products/all';
        }
    </script>
</body>
</html>
