<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 450px;">
        <h3 class="text-center mb-4">Регистрация в MiniStore</h3>
        
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label">Логин</label>
                <input type="text" id="reg-login" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" id="reg-password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Имя (отображаемое)</label>
                <input type="text" id="reg-name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Электронная почта</label>
                <input type="email" id="reg-email" class="form-control" required>
            </div>
            
            <button type="button" class="btn btn-success w-100" onclick="submitRegister()">Создать аккаунт</button>
            <div class="text-center mt-3">
                <a href="/login" class="text-decoration-none text-muted" style="font-size: 0.9em;">Уже есть аккаунт? Войти</a>
            </div>
        </form>
    </div>

    <script>
        async function submitRegister() {
            const user = {
                login: document.getElementById('reg-login').value,
                password: document.getElementById('reg-password').value,
                name: document.getElementById('reg-name').value,
                email: document.getElementById('reg-email').value,
                admin: false
            };

            if (!user.login || !user.password || !user.name) {
                alert("Заполните все обязательные поля");
                return;
            }

            try {
                const response = await fetch('/users/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(user)
                });

                const text = await response.text();
                alert(text);
                
                if (response.ok) {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error("Ошибка сети:", error);
                alert("Не удалось подключиться к серверу");
            }
        }
    </script>
</body>
</html>
